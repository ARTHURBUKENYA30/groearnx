name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: GROEARNX
          path: |
            app/
            lib/
            .github/
            .env.example
            .gitignore
            middleware.ts
            proxy.ts
            next.config.ts
            next-env.d.ts
            package.json
            package-lock.json
            README.md
            tsconfig.json
          if-no-files-found: error
          retention-days: 14
